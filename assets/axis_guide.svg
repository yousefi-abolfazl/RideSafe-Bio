<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" width="100%" role="img" aria-label="Axis convention guide: top view of X and Y directions, side view of Z directions" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="mXpos" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1e3a5f"/>
    </marker>
    <marker id="mXneg" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 z" fill="#ffffff" stroke="#3b82c4" stroke-width="1.6"/>
    </marker>
    <marker id="mYpos" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
    <marker id="mYneg" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 z" fill="#ffffff" stroke="#14b8a6" stroke-width="1.6"/>
    </marker>
    <marker id="mZpos" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5b4fa6"/>
    </marker>
    <marker id="mZneg" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 z" fill="#ffffff" stroke="#a78bfa" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="780" rx="14" fill="#f7f9fc"/>

  <!-- ============ LEFT: Top view (X/Y plane) ============ -->
  <rect x="16" y="16" width="504" height="748" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
  <text x="268" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Top view — X / Y plane</text>
  <text x="268" y="67" text-anchor="middle" font-size="12" fill="#64748b">vehicle seen from above · forward points up</text>
  </g>

  <!-- +X label capsule (beyond arrow tip, radial layout) -->
  <rect x="153" y="84" width="230" height="54" rx="12" fill="#e8eef5" stroke="#1e3a5f" stroke-width="1.5"/>
  <g paint-order="stroke" stroke="#e8eef5" stroke-width="3" stroke-linejoin="round">
  <text x="268" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a5f">+X · Forward</text>
  <text x="268" y="126" text-anchor="middle" font-size="12" fill="#475569">pressed into backrest</text>
  </g>

  <!-- +X Forward arrow -->
  <line x1="268" y1="196" x2="268" y2="144" stroke="#1e3a5f" stroke-width="5" stroke-linecap="round" marker-end="url(#mXpos)"/>

  <!-- vehicle outline -->
  <rect x="176" y="202" width="184" height="268" rx="58" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="220" y="216" width="96" height="16" rx="8" fill="#cbd5e1"/>

  <!-- seat -->
  <rect x="223" y="286" width="90" height="106" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <!-- seated rider seen from above -->
  <ellipse cx="268" cy="357" rx="30" ry="17" fill="#94a3b8"/>
  <circle cx="268" cy="312" r="20" fill="#94a3b8"/>
  <circle cx="268" cy="312" r="9" fill="#e2e8f0"/>

  <!-- ±Y arrows at mid-body height -->
  <line x1="368" y1="345" x2="446" y2="345" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#mYpos)"/>
  <line x1="168" y1="345" x2="90" y2="345" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#mYneg)"/>
  <!-- Y label capsules tucked above the arrow line with clear gap -->
  <rect x="372" y="272" width="118" height="32" rx="9" fill="#e6f4f2" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="45" y="272" width="118" height="32" rx="9" fill="#e6f4f2" stroke="#0f766e" stroke-width="1.5"/>
  <g paint-order="stroke" stroke="#e6f4f2" stroke-width="3" stroke-linejoin="round">
  <text x="431" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">+Y · Right</text>
  <text x="104" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">-Y · Left</text>
  </g>

  <!-- -X Rearward arrow -->
  <line x1="268" y1="478" x2="268" y2="528" stroke="#3b82c4" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#mXneg)"/>
  <!-- -X label capsule below the tip -->
  <rect x="123" y="538" width="290" height="54" rx="12" fill="#e8eef5" stroke="#3b82c4" stroke-width="1.5" stroke-dasharray="7 4"/>
  <g paint-order="stroke" stroke="#e8eef5" stroke-width="3" stroke-linejoin="round">
  <text x="268" y="560" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">-X · Rearward / Braking</text>
  <text x="268" y="580" text-anchor="middle" font-size="12" fill="#475569">thrown forward vs restraint</text>
  </g>

  <line x1="40" y1="610" x2="496" y2="610" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- legend -->
  <g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
  <text x="58" y="632" font-size="11.5" fill="#334155">+X · Forward — pressed into backrest</text>
  <text x="58" y="656" font-size="11.5" fill="#334155">-X · Rearward / Braking — thrown forward vs restraint</text>
  <text x="58" y="680" font-size="11.5" fill="#334155">±Y (+Y / -Y) · Right / Left (symmetric) — pressed sideways</text>
  <text x="268" y="710" text-anchor="middle" font-size="12" fill="#64748b">solid filled arrow = positive · hollow dashed = negative</text>
  <text x="268" y="732" text-anchor="middle" font-size="12" fill="#64748b">X family: navy / blues · Y family: teals</text>
  </g>
  <circle cx="42" cy="628" r="6" fill="#1e3a5f"/>
  <circle cx="42" cy="652" r="6" fill="#ffffff" stroke="#3b82c4" stroke-width="2"/>
  <circle cx="42" cy="676" r="6" fill="#0f766e"/>

  <!-- ============ RIGHT: Side view (X/Z plane) ============ -->
  <rect x="548" y="16" width="476" height="748" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
  <text x="786" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Side view — X / Z plane</text>
  <text x="786" y="67" text-anchor="middle" font-size="12" fill="#64748b">seat seen from the side · up points up</text>
  </g>

  <!-- ground + seat pedestal -->
  <line x1="586" y1="430" x2="826" y2="430" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <rect x="686" y="374" width="16" height="42" fill="#cbd5e1"/>
  <rect x="644" y="414" width="100" height="10" rx="5" fill="#cbd5e1"/>

  <!-- seat profile -->
  <rect x="620" y="218" width="26" height="140" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="620" y="348" width="170" height="26" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

  <!-- small seated rider -->
  <rect x="646" y="238" width="36" height="112" rx="14" fill="#94a3b8"/>
  <circle cx="664" cy="216" r="20" fill="#94a3b8"/>
  <circle cx="664" cy="216" r="9" fill="#e2e8f0"/>
  <rect x="680" y="324" width="72" height="22" rx="11" fill="#94a3b8"/>
  <rect x="732" y="324" width="20" height="66" rx="9" fill="#94a3b8"/>

  <!-- +Z Up arrow + capsule to its right -->
  <line x1="850" y1="335" x2="850" y2="215" stroke="#5b4fa6" stroke-width="5" stroke-linecap="round" marker-end="url(#mZpos)"/>
  <rect x="866" y="228" width="140" height="66" rx="12" fill="#eeedf7" stroke="#5b4fa6" stroke-width="1.5"/>
  <g paint-order="stroke" stroke="#eeedf7" stroke-width="3" stroke-linejoin="round">
  <text x="936" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#5b4fa6">+Z · Up</text>
  <text x="936" y="268" text-anchor="middle" font-size="11.5" fill="#475569">pressed into seat</text>
  <text x="936" y="284" text-anchor="middle" font-size="11.5" fill="#475569">(heavier)</text>
  </g>

  <!-- -Z Down arrow + capsule to its right -->
  <line x1="850" y1="360" x2="850" y2="452" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#mZneg)"/>
  <rect x="866" y="372" width="150" height="56" rx="12" fill="#eeedf7" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="7 4"/>
  <g paint-order="stroke" stroke="#eeedf7" stroke-width="3" stroke-linejoin="round">
  <text x="941" y="394" text-anchor="middle" font-size="15" font-weight="700" fill="#5b4fa6">-Z · Down</text>
  <text x="941" y="412" text-anchor="middle" font-size="11" fill="#475569">airtime / lift-off risk</text>
  </g>

  <line x1="572" y1="470" x2="1000" y2="470" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- legend -->
  <g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
  <text x="594" y="520" font-size="11.5" fill="#334155">+Z · Up — pressed into seat (heavier)</text>
  <text x="594" y="544" font-size="11.5" fill="#334155">-Z · Down — airtime / lift-off risk</text>
  <text x="786" y="580" text-anchor="middle" font-size="12" fill="#64748b">solid filled arrow = positive · hollow dashed = negative</text>
  <text x="786" y="602" text-anchor="middle" font-size="12" fill="#64748b">Z family: purples</text>
  </g>
  <circle cx="578" cy="516" r="6" fill="#5b4fa6"/>
  <circle cx="578" cy="540" r="6" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
</svg>
